# Hand-maintained [dist] config (matches the issuectl / glasspad convention).
# Formerly generated by `ossctl dist generate`, but that generator does not yet
# emit the cargo-dist Homebrew publisher this repo uses (ossctl issue
# homebrew-ci-delegated-adapter tracks closing that gap) — until it does, edit
# THIS file, then regenerate the workflow with `dist generate` (cargo-dist).
# The tag-triggered `.github/workflows/release.yml` is produced from the
# [dist] section below via `dist generate` — never hand-edit the workflow.
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.28.2"
ci = "github"
# curl-to-shell installer plus the Homebrew formula pushed to the tap below by
# the tag-triggered workflow (publish-homebrew-formula job, HOMEBREW_TAP_TOKEN
# repo secret — configured 2026-08-15). This replaces the stale hand-written
# cargo-install formula that sat at 0.3.0 with no publisher updating it.
installers = ["shell", "homebrew"]
tap = "jarimustonen/homebrew-project-canon"
publish-jobs = ["homebrew"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
]
hosting = "github"
github-attestations = true
pr-run-mode = "skip"
