# Generated by `ossctl dist generate` from OSS-RELEASE.md `distribution`.
# Edit distribution.* in OSS-RELEASE.md, then re-run `ossctl dist generate`.
# The tag-triggered `.github/workflows/release.yml` is produced from the
# [dist] section below via `dist generate` — never hand-edit the workflow.
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.28.2"
ci = "github"
installers = ["shell"]
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
]
hosting = "github"
github-attestations = true
pr-run-mode = "skip"

# PERSONAL / NON-STANDARD infra override (NOT project-canon canon — do not generate this
# for other projects). Build the macOS target on the self-hosted `hauis` runner
# (a personal Apple-silicon Mac registered to this repo) instead of GitHub's
# hosted macOS queue. hauis uses Homebrew Rust (no rustup), so it cannot
# cross-compile x86_64-apple-darwin; Intel-mac users install via
# `cargo install project-canon-cli`. This sub-table MUST stay at the end — a
# `[dist.*]` table placed among the `[dist]` scalar keys would swallow every
# key after it.
[dist.github-custom-runners]
aarch64-apple-darwin = "self-hosted"
