# Generated by `ossctl dist generate` from OSS-RELEASE.md `distribution`.
# Edit distribution.* in OSS-RELEASE.md, then re-run `ossctl dist generate`.
# The tag-triggered `.github/workflows/release.yml` is produced from the
# [dist] section below via `dist generate` — never hand-edit the workflow.
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.28.2"
ci = "github"
installers = ["shell"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
]
hosting = "github"
github-attestations = true
pr-run-mode = "skip"
